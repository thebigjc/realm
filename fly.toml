# fly.toml app configuration file generated for realm-status-bot on 2025-08-19T11:19:46-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'realm-status-bot'
primary_region = 'yyz'

[experimental]

[deploy]
  strategy = 'immediate'

[build]
  dockerfile = 'Dockerfile'

# Environment variables: set at deploy-time with `flyctl secrets set` or `flyctl deploy -e KEY=VAL`.
# Do not commit secrets or environment-specific values here.
# Example (secrets):
#   flyctl secrets set BNET_CLIENT_ID=... BNET_CLIENT_SECRET=... DISCORD_BOT_TOKEN=...
# Example (non-secret but per-env):
#   flyctl secrets set DISCORD_CHANNEL_IDS="123...,234..."

[[mounts]]
  source = 'realm_data'
  destination = '/app/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[metrics]
  port = 9090
  path = "/metrics"

# HTTP service exposing metrics & health. The app only needs a single port (9090).
# We include a health check pointing at /health with conservative timings to avoid flapping.
[[http_service]]
  internal_port = 9090
  force_https = false
  auto_stop_machines = false   # keep the bot running; don't scale to zero
  auto_start_machines = true
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

  # Health check: allow some startup / transient API hiccups.
  [[http_service.checks]]
    name = "health"
    method = "GET"
    path = "/health"
    protocol = "http"
    interval = "30s"       # check every 30s
    timeout = "5s"
    grace_period = "60s"   # give bot up to 60s to perform first successful poll
    restart_limit = 3       # restart after 3 consecutive failures
