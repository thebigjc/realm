[project]
name = "wow-realm-status-bot"
version = "0.1.0"
description = "Discord bot that tracks World of Warcraft realm availability and posts changes"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4.0",
    "httpx[http2]>=0.27.0",
    "pydantic>=2.11.9",
    "pytest>=8.4.2",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2.3",
    "prometheus-client>=0.20.0",
    "sentry-sdk>=2.13.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]

[project.scripts]
wow-realm-bnet = "realm_bot.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pyright>=1.1.405",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["realm_bot*"]
exclude = ["tests*", "data*", "docs*"]
